[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Old GoDaddy site's account/booking pages
[[redirects]]
  from = "/m/*"
  to = "/book/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/vendor/"
  status = 301

[[redirects]]
  from = "/admin/*"
  to = "/vendor/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Private pages: keep them out of search, and never leak their secret links in a Referer header
[[headers]]
  for = "/booking/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
